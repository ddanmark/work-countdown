<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>下班了吗 ⏰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;   /* 终极兜底：任何元素偏宽都不会出现横向滚动条 */
  }
  /* 允许输入框选择文本 */
  input { -webkit-user-select: text; user-select: text; }


  :root {
    --bg-1: #667eea;
    --bg-2: #764ba2;
    --card: rgba(255, 255, 255, 0.14);
    --card-border: rgba(255, 255, 255, 0.25);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.78);
    --accent: #ffd166;
    --danger: #ff6b6b;
    --ok: #06d6a0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    padding: 0;
    color: var(--text);
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    z-index: 0;
  }
  body::before { width: 400px; height: 400px; top: -120px; left: -120px; }
  body::after  { width: 300px; height: 300px; bottom: -100px; right: -80px; }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    min-width: 0;
  }

  .card {
    position: relative;
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 0;
    padding: 40px 28px;
    box-shadow: none;
    flex: 1;
    min-width: 0;          /* 允许 flex 收缩，防止内部内容（如倒计时）把卡片撑出容器 */
    overflow-x: hidden;    /* 双保险：内部偏宽的内容不会顶开卡片 */
    display: flex;
    flex-direction: column;
    /* 安全区：顶部留出状态栏，底部留出导航条 */
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: env(safe-area-inset-bottom);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  .title { font-size: 20px; font-weight: 600; letter-spacing: 1px; }

  /* 角落齿轮按钮 */
  .gear-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  .gear-btn:hover { background: rgba(255, 255, 255, 0.28); transform: rotate(45deg); }
  .gear-btn.active { background: var(--accent); color: #4a3a00; border-color: var(--accent); }
  .gear-btn svg { width: 18px; height: 18px; }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .status {
    display: inline-block;
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.18);
  }
  .next-break-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255, 209, 102, 0.25);
    border: 1px solid rgba(255, 209, 102, 0.4);
    color: #ffd166;
  }
  .status.working { background: rgba(6, 214, 160, 0.3); }
  .status.break   { background: rgba(255, 209, 102, 0.3); }
  .status.off     { background: rgba(255, 107, 107, 0.3); }
  .status.before  { background: rgba(255, 255, 255, 0.18); }
  .status.holiday { background: rgba(255, 107, 107, 0.35); }

  .countdown {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    margin: 8px 0 24px;
  }
  .time-block { text-align: center; }
  .time-num {
    font-size: 80px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: baseline;
    justify-content: center;
  }
  .time-num .ms {
    font-size: 34px;
    font-weight: 700;
    opacity: 0.7;
    margin-left: 2px;
    letter-spacing: 0;
  }
  .time-label { font-size: 13px; color: var(--text-dim); margin-top: 6px; letter-spacing: 1px; }
  .colon { font-size: 60px; font-weight: 800; opacity: 0.6; padding-bottom: 28px; }

  .progress-wrap { margin-top: 8px; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 10px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ok), var(--accent));
    border-radius: 999px;
    width: 0%;
    transition: width 1s ease;
  }

  .sub-info {
    margin-top: 18px;
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    min-height: 20px;
  }
  .sub-info b { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ===== 首页月历 ===== */
  .calendar-card {
    margin-top: 18px;
    padding: clamp(10px, 3vw, 14px);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-title {
    flex: 1;
    text-align: center;
    font-size: clamp(13px, 3.6vw, 15px);
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .cal-nav {
    width: clamp(26px, 7vw, 30px);
    height: clamp(26px, 7vw, 30px);
    flex-shrink: 0;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .cal-nav:hover { background: rgba(255, 255, 255, 0.22); }
  .cal-grid {
    display: grid;
    /* minmax(0,1fr)：防止单元格内容（如 8.0h、两位数、角标）把列撑宽导致超出卡片 */
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: clamp(3px, 1vw, 4px);
    /* 限制最大宽度，宽屏下单元格不会过大，整月历高度可控 */
    max-width: 380px;
    margin: 0 auto;
  }
  .cal-dow {
    text-align: center;
    font-size: clamp(10px, 2.8vw, 11px);
    font-weight: 700;
    color: var(--text-dim);
    opacity: 0.7;
    padding-bottom: 4px;
  }
  .cal-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    min-width: 0;
    overflow: hidden;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: clamp(11px, 3.4vw, 13px);
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.05);
    transition: transform 0.12s;
    user-select: none;
  }
  .cal-cell:hover { transform: scale(1.06); }
  .cal-cell.outside { opacity: 0.28; cursor: default; }
  .cal-cell.outside:hover { transform: none; }
  .cal-cell .cal-hours {
    font-size: clamp(7px, 2.3vw, 9px);
    font-weight: 700;
    opacity: 0.85;
    margin-top: 1px;
  }
  .cal-cell .cal-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: clamp(7px, 2.2vw, 9px);
    font-weight: 700;
    line-height: 1;
    padding: 1px 2px;
    border-radius: 6px;
  }
  /* 状态配色 */
  .cal-cell.work { color: #4a3a00; }
  .cal-cell.rest { background: rgba(140, 220, 150, 0.32); color: var(--text-dim); }
  .cal-cell.holiday {
    background: rgba(255, 107, 107, 0.32);
    color: #fff;
  }
  .cal-cell.holiday .cal-badge { background: rgba(255, 107, 107, 0.85); color: #fff; }
  .cal-cell.makeup {
    background: rgba(78, 205, 196, 0.32);
    color: #fff;
  }
  .cal-cell.makeup .cal-badge { background: rgba(78, 205, 196, 0.9); color: #06352f; }
  .cal-cell.leave {
    background: rgba(255, 159, 67, 0.4);
    color: #fff;
  }
  .cal-cell.leave .cal-badge { background: rgba(255, 159, 67, 0.95); color: #3a1d00; }
  .cal-cell.today {
    border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(255, 209, 102, 0.5);
  }
  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .cal-leg { display: inline-flex; align-items: center; gap: 4px; }
  .cal-leg-sw {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
  }
  .cal-leg-sw.leg-work { background: rgba(255, 209, 102, 0.65); }
  .cal-leg-sw.leg-rest { background: rgba(255, 255, 255, 0.18); }
  .cal-leg-sw.leg-holiday { background: rgba(255, 107, 107, 0.6); }
  .cal-leg-sw.leg-makeup { background: rgba(78, 205, 196, 0.6); }
  .cal-leg-sw.leg-leave { background: rgba(255, 159, 67, 0.75); }

  /* 设置面板 */
  /* 全屏设置面板：从右侧滑入 */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .settings-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .settings-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    box-shadow: -10px 0 40px rgba(0, 0, 0, 0.4);
  }
  .settings-panel.open {
    transform: translateX(0);
  }
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(16px + env(safe-area-inset-top)) 24px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    flex-shrink: 0;
  }
  .settings-title { font-size: 20px; font-weight: 700; }
  .settings-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  .settings-close:hover { background: rgba(255, 255, 255, 0.25); }

  /* 设置面板 Tab 切换 */
  .settings-tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 4px;
  }
  .settings-tab-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .settings-tab-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
  }
  .settings-tab-content { display: block; }
  .settings-tab-content.hidden { display: none; }

  .settings-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px calc(24px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }

  .auto-save-hint {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 16px;
    opacity: 0.85;
  }

  /* 排班模式 */
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 4px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .mode-tab.active { background: var(--accent); color: #4a3a00; }

  .bigsmall-config {
    margin-top: 14px;
    padding: 14px;
    background: rgba(255, 209, 102, 0.1);
    border: 1px solid rgba(255, 209, 102, 0.3);
    border-radius: 12px;
  }
  .bigsmall-config .bs-label { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
  .week-type-selector { display: flex; gap: 8px; }
  .week-type-btn {
    flex: 1;
    padding: 12px 8px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .week-type-btn.active {
    background: rgba(255, 209, 102, 0.28);
    border-color: var(--accent);
    color: var(--accent);
  }
  .week-type-btn small { display: block; font-size: 11px; font-weight: 400; opacity: 0.8; margin-top: 2px; }

  /* 周几选择器 */
  .weekday-bar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 20px;
    margin-top: 18px;
  }
  .weekday {
    aspect-ratio: 1 / 1;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-dim);
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.2s ease;
  }
  .weekday:hover { background: rgba(255, 255, 255, 0.18); }
  .weekday.active {
    background: var(--accent);
    color: #4a3a00;
    border-color: var(--accent);
  }
  .weekday.today::after {
    content: "";
    position: absolute;
    bottom: 5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .weekday.today.active::after { background: #4a3a00; }
  .weekday.off-day { opacity: 0.45; }
  .weekday.alt { border-style: dashed; }
  .weekday.alt::before {
    content: "↻";
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 9px;
    color: var(--accent);
    opacity: 0.9;
  }

  .section { margin-bottom: 18px; }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 工作日开关 */
  .workday-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .workday-toggle span { font-size: 15px; font-weight: 600; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    transition: 0.3s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px;
    width: 20px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.3s;
  }
  .switch input:checked + .slider { background: var(--ok); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* 周六大小周提示框 */
  .sat-info {
    padding: 12px 16px;
    background: rgba(255, 209, 102, 0.12);
    border: 1px solid rgba(255, 209, 102, 0.35);
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .sat-info .sat-status { color: var(--accent); font-weight: 600; }

  .day-body.disabled { opacity: 0.4; pointer-events: none; }

  /* 时间行：两个时间块左右各半，label 在上 input 在下，移动端易点 */
  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .time-field { display: flex; flex-direction: column; gap: 6px; }
  .time-row label { font-size: 12px; color: var(--text-dim); padding-left: 2px; }

  /* 自定义时间选择器：整体一个圆角容器，HH : MM 内嵌 */
  .tp {
    display: flex;
    align-items: center;
    width: 100%;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  .tp-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 12px 6px;
    font-size: 18px;
    font-family: inherit;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    text-align: center;
    outline: none;
    transition: background 0.15s ease;
  }
  .tp-btn:active { background: rgba(255, 255, 255, 0.12); }
  .tp-colon {
    font-size: 18px;
    font-weight: 700;
    opacity: 0.5;
    flex-shrink: 0;
    pointer-events: none;
  }
  /* 休息段里的选择器更紧凑 */
  .break-row .tp { background: transparent; border-color: rgba(255,255,255,0.1); }
  .break-row .tp-btn { padding: 9px 4px; font-size: 16px; }

  /* 弹出式时间选择面板（底部滑入） */
  .tp-picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .tp-picker-overlay.open { opacity: 1; }
  .tp-picker-panel {
    width: 100%;
    max-width: 480px;
    background: rgba(30, 22, 48, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tp-picker-overlay.open .tp-picker-panel { transform: translateY(0); }
  .tp-picker-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
    margin-bottom: 16px;
  }
  .tp-picker-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .tp-picker-cell {
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .tp-picker-cell:hover { background: rgba(255, 255, 255, 0.16); }
  .tp-picker-cell.active {
    background: var(--accent);
    color: #4a3a00;

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {

  }
  .btn-primary { background: var(--accent); color: #4a3a00; }
  .btn-primary:hover { background: #ffdb7d; transform: translateY(-1px); }
  .btn-ghost { background: rgba(255, 255, 255, 0.14); color: var(--text); }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.26); }

  .toast {
    position: fixed;
    bottom: 30px;

    transition: all 0.3s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* QR 导出/导入弹窗 */
  .qr-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .qr-overlay.open { opacity: 1; pointer-events: auto; }
  .qr-modal {
    background: rgba(30, 22, 48, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: scale(0.9);

  }
  .qr-overlay.open .qr-modal { transform: scale(1); }
  .qr-modal-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .qr-tip {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
    text-align: center;
  }
  .qr-code-box {
    background: #fff;
    padding: 12px;
    border-radius: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-code-box canvas, .qr-code-box img {
    display: block;
  }
  .qr-modal .btn { width: 100%; }

  /* 实时扫描界面 */
  .scan-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .scan-overlay.open { display: flex; }
  .scan-overlay video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scan-frame {
    position: relative;
    width: 65vw;
    max-width: 280px;
    height: 65vw;
    max-height: 280px;
    z-index: 2;
  }
  .scan-corner {
    position: absolute;
    width: 30px; height: 30px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
  }
  .scan-corner.tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 8px; }
  .scan-corner.tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 8px; }
  .scan-corner.bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 8px; }
  .scan-corner.br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 8px; }
  @keyframes scanMove {
    0% { top: 0; opacity: 1; }
    50% { top: calc(100% - 3px); opacity: 1; }
    100% { top: 0; opacity: 0.6; }
  }
  .scan-line {
    position: absolute;
    left: 4px; right: 4px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ffd166, transparent);
    border-radius: 3px;
    animation: scanMove 2s ease-in-out infinite;
    box-shadow: 0 0 10px #ffd166;
  }
  .scan-hint {
    position: absolute;
    bottom: calc(80px + env(safe-area-inset-bottom));
    color: #fff;
    font-size: 15px;
    z-index: 2;
    text-align: center;
    width: 100%;
  }
  .scan-cancel {
    position: absolute;
    top: calc(20px + env(safe-area-inset-top));
    right: 20px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 420px) {
    .time-num { font-size: 58px; }
    .time-num .ms { font-size: 26px; }
    .colon { font-size: 44px; padding-bottom: 22px; }
    /* 窄屏减小卡片左右内边距，给月历腾出空间 */
    .card { padding-left: 16px; padding-right: 16px; }
    /* 模式按钮文字更紧凑 */
    .mode-tab { padding: 9px 4px; font-size: 13px; }
    .week-type-btn { padding: 10px 6px; }
  }

  /* ===== 解压发泄功能 ===== */
  /* 全屏特效画布：覆盖一切但不拦截点击 */
  #fxCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 100;
  }

  /* 左下角浮动按钮 */
  .vent-btn {
    position: fixed;
    left: 18px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 26px;
    cursor: pointer;
    z-index: 60;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    transition: transform 0.25s ease, background 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }
  .vent-btn:hover { background: rgba(255, 255, 255, 0.3); }
  .vent-btn:active { transform: scale(0.9); }
  .vent-btn.active {
    background: var(--danger);
    transform: rotate(90deg);
  }
  /* 川剧变脸：切换时翻转 */
  .vent-btn .face {
    display: inline-block;
    line-height: 1;
  }
  .vent-btn .face.flip {
    animation: faceFlip 0.35s ease;
  }
  @keyframes faceFlip {
    0% { transform: rotateY(0deg) scale(1); }
    50% { transform: rotateY(90deg) scale(1.2); }
    100% { transform: rotateY(0deg) scale(1); }
  }

  /* 表情面板 */
  .vent-panel {
    position: fixed;
    left: 18px;
    bottom: calc(84px + env(safe-area-inset-bottom));
    width: 200px;
    background: rgba(40, 30, 60, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px;
    z-index: 61;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);

    transform: translateY(12px) scale(0.92);
    transform-origin: bottom left;
    pointer-events: none;
    transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .vent-panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .vent-panel-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px;
    text-align: center;
  }
  .vent-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .vent-item {
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all 0.18s ease;
    font-family: inherit;
    padding: 0;
  }
  .vent-item small {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .vent-item:hover { background: rgba(255, 255, 255, 0.18); transform: translateY(-2px); }
  .vent-item:active { transform: scale(0.88); }
  .vent-tip {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    opacity: 0.7;
  }

  /* ===== 全屏特效：震屏 / 挤压 / 裂痕 ===== */
  @keyframes fxShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(calc(-1 * var(--shake-i)), calc(var(--shake-i) * 0.5)); }
    40% { transform: translate(var(--shake-i), calc(-1 * var(--shake-i) * 0.5)); }
    60% { transform: translate(calc(-1 * var(--shake-i) * 0.7), var(--shake-i)); }
    80% { transform: translate(var(--shake-i), calc(-1 * var(--shake-i) * 0.7)); }
  }
  .fx-shake { animation: fxShake 0.12s linear infinite; }

  @keyframes fxSqueeze {
    0% { transform: scale(1, 1); }
    20% { transform: scale(1.15, 0.8); }   /* 横向拉伸、纵向压扁 */
    45% { transform: scale(0.88, 1.12); }  /* 反弹：纵向拉长 */
    65% { transform: scale(1.05, 0.95); }
    82% { transform: scale(0.97, 1.03); }
    100% { transform: scale(1, 1); }
  }
  .fx-squeeze { animation: fxSqueeze 0.6s ease-out; }

  /* 裂痕覆盖层 */
  #crackLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 101;
  }
  .crack-svg {
    position: absolute;
    transition: opacity 0.8s ease;
  }
  /* 主裂纹亮线（高光） */
  .crack-line {
    fill: none;
    stroke: rgba(255, 255, 255, 0.92);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
  }
  /* 暗影底线（模拟裂纹深度） */
  .crack-shadow {
    fill: none;
    stroke: rgba(0, 0, 0, 0.55);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .crack-line-small {
    fill: none;
    stroke: rgba(255, 255, 255, 0.45);
    stroke-width: 1.2;
    stroke-linecap: round;
  }
  .crack-line-small-shadow {
    fill: none;
    stroke: rgba(0, 0, 0, 0.35);
    stroke-width: 3;
    stroke-linecap: round;
  }
  .crack-center {
    fill: rgba(0, 0, 0, 0.55);
    stroke: rgba(255, 255, 255, 0.85);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.6));
  }

  /* 撕屏覆盖层：单条竖向撕裂裂缝，可叠加多条 */
  .tear-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 102;
    overflow: hidden;
  }
  /* 左半片：从撕裂线到屏幕左边 */
  .tear-piece-l {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.55, 0.085, 0.68, 0.53);
  }
  /* 右半片：从撕裂线到屏幕右边 */
  .tear-piece-r {
    position: absolute;
    top: 0; right: 0;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.55, 0.085, 0.68, 0.53);
  }
  /* 撕裂边缘锯齿 SVG 容器 */
  .tear-jag {
    position: absolute;
    top: 0;
    height: 100%;
    width: 20px;
  }
</style>

  let cfg = parseConfig(null);

  // 上下班时间选择器实例（懒初始化）
  let workStartPicker = null, workEndPicker = null;
  // 启动期标志：异步从 Preferences 加载配置时，如果用户已经做过任何修改
  // （手动改设置 / 导入二维码 / 重置），就不再覆盖当前 cfg，
  // 防止异步回调用启动时拍下的旧数据把新数据挤掉。
  let isInitialLoad = true;

  // ---------- 配置解析（纯函数） ----------
  function parseConfig(saved) {
    if (saved && saved.schedules) {
      const def = defaultSchedules();
      const out = {};
      for (const k of Object.keys(def)) {
        out[k] = Object.assign({ breaks: [] }, def[k], saved.schedules[k] || {});
        if (!Array.isArray(out[k].breaks)) out[k].breaks = [];
        // 向后兼容：给旧数据补 name 字段
        out[k].breaks.forEach((br, idx) => {
          if (!br.name) br.name = "休息" + (idx + 1);
        });
      }
      return {
        schedules: out,
        mode: saved.mode === "bigSmall" ? "bigSmall" : "fixed",
        bigSmallAnchor: (saved.bigSmallAnchor && saved.bigSmallAnchor.monday) ? saved.bigSmallAnchor : null,
        holidays: (saved.holidays && typeof saved.holidays === "object") ? saved.holidays : {},
        deletedBuiltinHolidays: (saved.deletedBuiltinHolidays && typeof saved.deletedBuiltinHolidays === "object") ? saved.deletedBuiltinHolidays : {},
        leaves: (saved.leaves && typeof saved.leaves === "object") ? saved.leaves : {},
      };
    }
    return { schedules: defaultSchedules(), mode: "fixed", bigSmallAnchor: null, holidays: {}, deletedBuiltinHolidays: {}, leaves: {} };
  }

  // ---------- 配置压缩/解压（用于 QR 码，缩短 key 减小数据量） ----------
  function compactConfig(cfg) {
    var out = { s: {}, m: cfg.mode || "fixed" };
    if (cfg.bigSmallAnchor) out.a = cfg.bigSmallAnchor;
    for (var k in cfg.schedules) {
      var d = cfg.schedules[k];
      var cd = { e: d.enabled ? 1 : 0 };
      // 仅在非默认值时才写入上下班时间（默认 09:00 / 18:00）
      if (d.workStart && d.workStart !== "09:00") cd.ws = d.workStart;
      if (d.workEnd && d.workEnd !== "18:00") cd.we = d.workEnd;
      if (d.breaks && d.breaks.length > 0) {
        cd.b = d.breaks.map(function (br) {
          // 默认休息名「午休」省略，只存 [start, end]
          if (br.name === "午休") return [br.start, br.end];
          return [br.name || "", br.start, br.end];
        });
      }
      out.s[k] = cd;
    }
    // 节假日覆盖（用户自定义的）
    if (cfg.holidays && Object.keys(cfg.holidays).length > 0) out.h = cfg.holidays;
    // 已删除的内置节假日
    if (cfg.deletedBuiltinHolidays && Object.keys(cfg.deletedBuiltinHolidays).length > 0) out.dh = cfg.deletedBuiltinHolidays;
    // 请假（日期 → 理由）
    if (cfg.leaves && Object.keys(cfg.leaves).length > 0) out.lv = cfg.leaves;
    return out;
  }
  function expandConfig(compact) {
    if (!compact || !compact.s) return null;
    var out = { schedules: {}, mode: compact.m === "bigSmall" ? "bigSmall" : "fixed", bigSmallAnchor: compact.a || null };
    for (var k in compact.s) {
      var cd = compact.s[k];
      var breaks = [];
      if (cd.b) {
        breaks = cd.b.map(function (arr) {
          // 兼容三种历史格式：[name,start,end] / ["",start,end] / [start,end]
          if (arr.length >= 3) {
            return { name: arr[0] || ("休息" + (breaks.length + 1)), start: arr[1], end: arr[2] };
          }
          return { name: "午休", start: arr[0], end: arr[1] };
        });
      }
      out.schedules[k] = {
        enabled: !!cd.e,
        workStart: cd.ws || "09:00",
        workEnd: cd.we || "18:00",
        breaks: breaks
      };
    }
    // 恢复节假日覆盖
    if (compact.h) out.holidays = compact.h;
    if (compact.dh) out.deletedBuiltinHolidays = compact.dh;
    // 恢复请假
    if (compact.lv) out.leaves = compact.lv;
    return out;
  }

  // ---------- 存储层：原生 Preferences（持久） + localStorage 兜底 ----------
  function getPreferencesPlugin() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
      return window.Capacitor.Plugins.Preferences;
    }
    return null;
  }

  // 同步从 localStorage 读取（启动初始值，避免界面闪烁）
  function readLocalSync() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    } catch (e) { return null; }
  }

  // 异步读取：优先 Preferences，回退 localStorage
  async function loadConfigAsync() {
    const pref = getPreferencesPlugin();
    if (pref) {
      try {
        const { value } = await pref.get({ key: STORAGE_KEY });
        if (value) return JSON.parse(value);
      } catch (e) { /* 回退 */ }
    }
    return readLocalSync();
  }

  // 双写：Preferences（可靠） + localStorage（兜底/浏览器预览）
  function persist() {
    const str = JSON.stringify(cfg);
    try { localStorage.setItem(STORAGE_KEY, str); } catch (e) {}
    // 一旦写入，cfg 已是最新，标记为"非初始"，防止后面启动时的异步
    // loadConfigAsync 回调用旧数据覆盖回 cfg。
    isInitialLoad = false;
    const pref = getPreferencesPlugin();
    if (pref) {
      pref.set({ key: STORAGE_KEY, value: str }).then(function () {
        // 保存成功后刷新桌面小部件
        notifyWidgetRefresh();
      }).catch(function () {});
    }
    // 也立即尝试通知（Preferences 是异步的，但广播不依赖它完成）
    notifyWidgetRefresh();
  }

  // 通知 Android 桌面小部件刷新（发送原生广播）
  function notifyWidgetRefresh() {
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      try {
        // Capacitor 没有直接的发送广播 API，用 Preferences 触发不够，
        // 实际刷新靠 MainActivity onWindowFocusChanged + 每秒 ticker。
        // 这里预留，原生层会在 app 获得焦点时自动刷新。
      } catch (e) {}
    }
  }

  // ---------- 工具 ----------
  function toDate(hhmm, base) {
    const [h, m] = hhmm.split(":").map(Number);
    const d = new Date(base);
    d.setHours(h, m, 0, 0);
    return d;
  }
  function pad(n) { return String(n).padStart(2, "0"); }

  // ---------- 自定义时间选择器：小时(每1) + 分钟(每5)，值格式 "HH:MM" ----------
  // 移动端原生 time input 的 step 不生效，故用两个 select 自定义
  function createTimePicker(initialValue, onChange) {
    let curH = 9, curM = 0;
    const wrap = document.createElement("div");
    wrap.className = "tp";

    // 小时按钮（可点击）
    const hourBtn = document.createElement("button");
    hourBtn.type = "button";
    hourBtn.className = "tp-btn";
    const colon = document.createElement("span");
    colon.className = "tp-colon"; colon.textContent = ":";
    // 分钟按钮（可点击）
    const minBtn = document.createElement("button");
    minBtn.type = "button";
    minBtn.className = "tp-btn";

    wrap.appendChild(hourBtn);
    wrap.appendChild(colon);
    wrap.appendChild(minBtn);

    function fire() {
      hourBtn.textContent = pad(curH);
      minBtn.textContent = pad(curM);
      if (onChange) onChange(pad(curH) + ":" + pad(curM));
    }

    // 弹出选择面板
    function openPicker(type) {
      // 遮罩
      const overlay = document.createElement("div");
      overlay.className = "tp-picker-overlay";

      // 面板
      const panel = document.createElement("div");
      panel.className = "tp-picker-panel";
      const title = document.createElement("div");
      title.className = "tp-picker-title";
      title.textContent = type === "h" ? "选择小时" : "选择分钟";
      panel.appendChild(title);

      // 网格
      const grid = document.createElement("div");
      grid.className = "tp-picker-grid";
      const values = type === "h"
        ? Array.from({ length: 24 }, (_, i) => i)
        : Array.from({ length: 12 }, (_, i) => i * 5);
      const curVal = type === "h" ? curH : curM;

      values.forEach(function (v) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tp-picker-cell";
        if (v === curVal) b.classList.add("active");
        b.textContent = pad(v);
        b.addEventListener("click", function () {
          if (type === "h") curH = v; else curM = v;
          fire();
          close();
        });
        grid.appendChild(b);
      });
      panel.appendChild(grid);

      function close() {
        overlay.classList.remove("open");
        setTimeout(function () {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 200);
      }
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) close();
      });

      overlay.appendChild(panel);
      document.body.appendChild(overlay);
      requestAnimationFrame(function () { overlay.classList.add("open"); });
    }

    hourBtn.addEventListener("click", function () { openPicker("h"); });
    minBtn.addEventListener("click", function () { openPicker("m"); });

    const api = {
      el: wrap,
      getValue: function () { return pad(curH) + ":" + pad(curM); },
      setValue: function (hhmm) {
        const parts = (hhmm || "09:00").split(":").map(Number);
        curH = parts[0] || 0;
        curM = Math.floor((parts[1] || 0) / 5) * 5;
        fire();
      },
    };
    api.setValue(initialValue || "09:00");
    return api;
  }
  function ymd(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function fmtDur(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    return {
      h: Math.floor(totalSec / 3600),
      m: Math.floor((totalSec % 3600) / 60),
      s: totalSec % 60,
    };
  }
  function humanDuration(ms) {
    const { h, m } = fmtDur(ms);
    if (h > 0) return h + "小时" + (m > 0 ? m + "分钟" : "");
    if (m > 0) return m + "分钟";
    return fmtDur(ms).s + "秒";
  }
  function showToast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.toast.classList.remove("show"), 1800);
  }

  // 取某天所在自然周的周一（中国惯例：周一为一周开始）
  function getMondayOfWeek(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = d.getDay(); // 0=Sun .. 6=Sat
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // 判断某天是否属于"大周"（周六上班的那周）
  function isBigWeek(date) {
    if (!cfg.bigSmallAnchor || !cfg.bigSmallAnchor.monday) return true;
    const weekStart = getMondayOfWeek(date);
    const anchor = new Date(cfg.bigSmallAnchor.monday + "T00:00:00");
    const weeksDiff = Math.round((weekStart - anchor) / (7 * 86400000));
    const anchorIsBig = cfg.bigSmallAnchor.type === "big";
    const sameAsAnchor = (((weeksDiff % 2) + 2) % 2) === 0;
    return sameAsAnchor ? anchorIsBig : !anchorIsBig;
  }

  // 该日期是否请假（在 cfg.leaves 中）
  function isLeaveDay(date) {
    return !!(cfg.leaves && cfg.leaves.hasOwnProperty(ymd(date)));
  }

  // 该日期是否为工作日（法定假日/调休 > 请假 > 大小周 > day.enabled）
  function isWorkDay(date) {
    // 1) 法定节假日覆盖（最高优先级）
    var override = getHolidayOverride(date);
    if (override === "workday") {
      // 调休上班日，强制工作日——但若请假则不算
      if (isLeaveDay(date)) return false;
      return true;
    }
    if (override === "holiday") return false;  // 法定假日，强制休息

    // 2) 请假：当天按非工作日处理（影响倒计时/周进度/月历）
    if (isLeaveDay(date)) return false;

    // 3) 大小周 / 固定排班逻辑
    const idx = date.getDay();
    const sch = cfg.schedules[idx];
    if (!sch) return false;
    if (cfg.mode === "bigSmall" && idx === 6) {
      return isBigWeek(date) && !!sch.workStart && !!sch.workEnd;
    }
    return !!sch.enabled;
  }

  // 判断某日是否是法定节假日（只查内置表，用于状态文字区分）
  function isBuiltinHoliday(date) {
    var key = ymd(date);
    return BUILTIN_HOLIDAYS.hasOwnProperty(key) && BUILTIN_HOLIDAYS[key] === "holiday";
  }

  // 设置"本周"为大周/小周（锚定到本周周一）
  function setThisWeekType(type) {
    cfg.bigSmallAnchor = { monday: ymd(getMondayOfWeek(new Date())), type: type };
  }

  // 计算某天配置下 [from, to] 区间内的净工作时长（扣除休息段，夹在上下班内）
  function netWorkMs(day, from, to) {
    if (!day) return 0;
    const base = from.getTime();
    const ws = toDate(day.workStart, base);
    const we = toDate(day.workEnd, base);
    const lo = new Date(Math.max(from.getTime(), ws.getTime()));
    const hi = new Date(Math.min(to.getTime(), we.getTime()));
    if (hi <= lo) return 0;
    let total = hi - lo;
    (day.breaks || []).forEach(b => {
      if (!b || !b.start || !b.end) return;
      const bs = toDate(b.start, base);
      const be = toDate(b.end, base);
      const overlap = Math.max(0, Math.min(hi, be) - Math.max(lo, bs));
      total -= overlap;
    });
    return Math.max(0, total);
  }

  function totalWorkMs(day) {
    if (!day) return 0;
    const base = Date.now();
    return netWorkMs(day, toDate(day.workStart, base), toDate(day.workEnd, base));
  }

  function currentBreak(day, now) {
    if (!day) return null;
    const base = now.getTime();
    for (const b of (day.breaks || [])) {
      if (!b || !b.start || !b.end) continue;
      const bs = toDate(b.start, base);
      const be = toDate(b.end, base);
      if (now >= bs && now < be) return b;
    }
    return null;
  }

  // 查找当前时间之后的下一段休息（返回 {start, end} 或 null）
  function findNextBreak(day, now) {
    if (!day || !day.breaks || day.breaks.length === 0) return null;
    const base = now.getTime();
    let earliest = null;
    let name = null;
    for (const b of day.breaks) {
      if (!b || !b.start || !b.end) continue;
      const bs = toDate(b.start, base);
      if (bs > now) {
        if (!earliest || bs < earliest) {
          earliest = bs;
          name = b.name || "休息";
        }
      }
    }
    return earliest ? { time: earliest, name: name } : null;
  }

  // 查找从 from 起下一个工作日（用于已下班/休息日提示）
  function findNextWorkStart(from) {
    for (let i = 1; i <= 14; i++) {
      const next = new Date(from.getTime() + i * 86400000);
      if (isWorkDay(next)) {
        const ni = next.getDay();
        const sch = cfg.schedules[ni];
        return { date: next, idx: ni, start: toDate(sch.workStart, next.getTime()) };
      }
    }
    return null;
  }

  // ---------- 排班模式 UI ----------
  function renderModeUI() {

  el.modeTabs.querySelectorAll(".mode-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      cfg.mode = btn.dataset.mode;
      if (cfg.mode === "bigSmall") {

  // 渲染【法定节假日】小 tab（内置表，按节日分类分组）
  function renderBuiltinHolidays() {
    var list = el.holidayBuiltinList;
    list.innerHTML = "";
    var frag = document.createDocumentFragment();

    var totalBuiltin = 0;
    HOLIDAY_GROUPS.forEach(function(group) {
      // 收集该分类下未删除的日期
      var dates = [];
      group.holidays.forEach(function(d) {
        if (!cfg.deletedBuiltinHolidays || !cfg.deletedBuiltinHolidays.hasOwnProperty(d)) {
          dates.push({ date: d, type: "holiday", overridden: !!(cfg.holidays && cfg.holidays.hasOwnProperty(d)) });
        }
      });
      group.workdays.forEach(function(d) {
        if (!cfg.deletedBuiltinHolidays || !cfg.deletedBuiltinHolidays.hasOwnProperty(d)) {
          dates.push({ date: d, type: "workday", overridden: !!(cfg.holidays && cfg.holidays.hasOwnProperty(d)) });
        }
      });
      if (dates.length === 0) return;
      totalBuiltin += dates.length;
      dates.sort(function(a, b) { return a.date.localeCompare(b.date); });

      // 分类标题行
      var catDiv = document.createElement("div");
      catDiv.className = "holiday-category-header";
      catDiv.innerHTML = '<span class="holiday-category-icon">📌</span>' +
        '<span class="holiday-category-name">' + group.name + '</span>' +
        '<span class="holiday-category-count">' + dates.length + '天</span>';
      frag.appendChild(catDiv);

      // 该分类下的具体日期
      dates.forEach(function(item) {
        var isH = item.type === "holiday";
        var div = document.createElement("div");
        div.className = "holiday-item";
        div.innerHTML =
          '<span class="holiday-label">' +
          '<span>' + item.date + '</span>' +
          '<span class="holiday-tag ' + (isH ? "tag-holiday" : "tag-workday") + '">' + (isH ? "🎉 休" : "💼 班") + '</span>' +
          (item.overridden ? '<span class="holiday-override-badge">已修改</span>' : '') +
          '</span>' +
          '<span class="holiday-actions">' +
          '<button class="holiday-edit" data-date="' + item.date + '" data-type="' + item.type + '" title="编辑">✎</button>' +
          '<button class="holiday-del" data-date="' + item.date + '" data-builtin="1" title="删除">✕</button>' +
          '</span>';
        frag.appendChild(div);
      });
    });

    if (totalBuiltin === 0) {
      var emptyDiv = document.createElement("div");
      emptyDiv.style.cssText = "font-size:13px;color:var(--text-dim);padding:8px 12px;";
      emptyDiv.textContent = "暂无法定节假日数据";
      frag.appendChild(emptyDiv);
    }

    list.appendChild(frag);
    bindHolidayItemEvents(list);
  }

  // 渲染【自定义节假日】小 tab（不在内置表中的用户项）
  function renderCustomHolidays() {
    var list = el.holidayCustomList;
    list.innerHTML = "";
    var frag = document.createDocumentFragment();

    var customDates = [];
    if (cfg.holidays) {
      Object.keys(cfg.holidays).forEach(function(k) {
        // 不在内置表中的才是纯自定义的
        if (!BUILTIN_HOLIDAYS.hasOwnProperty(k)) {
          customDates.push({ date: k, type: cfg.holidays[k] });
        }
      });
    }
    customDates.sort(function(a, b) { return a.date.localeCompare(b.date); });

    if (customDates.length === 0) {
      var emptyDiv = document.createElement("div");
      emptyDiv.style.cssText = "font-size:13px;color:var(--text-dim);padding:8px 12px;";
      emptyDiv.textContent = "暂无自定义节假日，使用上方表单添加";
      frag.appendChild(emptyDiv);
    } else {
      customDates.forEach(function(item) {
        var isH = item.type === "holiday";
        var div = document.createElement("div");
        div.className = "holiday-item";
        div.innerHTML =
          '<span class="holiday-label">' +
          '<span>' + item.date + '</span>' +
          '<span class="holiday-tag ' + (isH ? "tag-holiday" : "tag-workday") + '">' + (isH ? "🎉 休" : "💼 班") + '</span>' +
          '</span>' +
          '<span class="holiday-actions">' +
          '<button class="holiday-edit" data-date="' + item.date + '" data-type="' + item.type + '" data-builtin="0" title="编辑">✎</button>' +
          '<button class="holiday-del" data-date="' + item.date + '" data-builtin="0" title="删除">✕</button>' +
          '</span>';
        frag.appendChild(div);
      });

    list.appendChild(frag);

  // 给某个列表内的编辑/删除按钮绑定事件（两个小 tab 共用）
  function bindHolidayItemEvents(list) {
    // 绑定编辑按钮
    list.querySelectorAll(".holiday-edit").forEach(function(btn) {
      btn.addEventListener("click", function() {
        el.holidayDateInput.value = this.dataset.date;
        el.holidayTypeSelect.value = this.dataset.type;
        el.holidayDateInput.scrollIntoView({ behavior: "smooth" });
        el.holidayDateInput.focus();
        showToast("已载入 " + this.dataset.date + "，修改后点击添加即可覆盖");
      });
    });

    // 绑定删除按钮
    list.querySelectorAll(".holiday-del").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var date = this.dataset.date;
        var isBuiltin = this.dataset.builtin === "1";
        if (isBuiltin) {
          // 内置节假日：标记为已删除
          if (!cfg.deletedBuiltinHolidays) cfg.deletedBuiltinHolidays = {};
          cfg.deletedBuiltinHolidays[date] = true;
        } else {
          // 自定义节假日：直接删除
          if (cfg.holidays && cfg.holidays.hasOwnProperty(date)) {
            delete cfg.holidays[date];
          }
        }
        persist();
        renderHolidayList();
        update();
        showToast("已移除 " + date);
      });
    });
  }

  el.holidayAddBtn.addEventListener("click", function () {

    if (!dateVal) { showToast("请先选择日期"); return; }
    var type = el.holidayTypeSelect.value;
    if (!cfg.holidays) cfg.holidays = {};
    cfg.holidays[dateVal] = type;
    // 如果用户在恢复一个已删除的内置节假日
    if (cfg.deletedBuiltinHolidays && cfg.deletedBuiltinHolidays.hasOwnProperty(dateVal)) {
      delete cfg.deletedBuiltinHolidays[dateVal];

    persist();
    renderHolidayList();

    var typeName = type === "holiday" ? "节假日（休息）" : "调休日（上班）";
    showToast("已设置 " + dateVal + " 为" + typeName);
    // 自动切换到对应小 tab：内置日期→法定，纯自定义日期→自定义

  function updateDurationHints() {
    const day = cfg.schedules[editingDay];
    const base = Date.now();
    const ws = toDate(day.workStart, base);
    const we = toDate(day.workEnd, base);

    if (we <= ws) {
      el.workDurationHint.textContent = "⚠️ 下班时间应晚于上班时间";
    } else {
      const span = we - ws;
      const net = netWorkMs(day, ws, we);
      const breakSum = span - net;
      el.workDurationHint.textContent = breakSum > 0
        ? "总跨度 " + humanDuration(span) + " · 休息合计 " + humanDuration(breakSum) + " · 实际工作 " + humanDuration(net)
        : "总跨度 " + humanDuration(span) + " · 实际工作 " + humanDuration(net);
    }

    let warn = "";
    (day.breaks || []).forEach((b, i) => {
      if (toDate(b.end, base) <= toDate(b.start, base)) warn += "休息" + (i + 1) + "结束应晚于开始；";
    });
    el.breakDurationHint.textContent = warn
      ? "⚠️ " + warn.replace(/；$/, "")
      : ((day.breaks || []).length === 0 ? "暂无休息时间段" : "共 " + day.breaks.length + " 段休息");
  }

  // 扫描：用 getUserMedia 实时视频流扫描
  let scanStream = null, scanRAF = null;
  el.qrImportScan.addEventListener("click", async function () {
    el.qrImportOverlay.classList.remove("open");
    el.scanHint.textContent = "将二维码对准框内";
    el.scanOverlay.classList.add("open");

    try {
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false,
      });
      el.scanVideo.srcObject = scanStream;
      el.scanVideo.play();
      startScanLoop();
    } catch (err) {
      // getUserMedia 不支持（如 file:// 或无 HTTPS），降级到拍照
      el.scanOverlay.classList.remove("open");
      showToast("实时扫描不可用，改用拍照模式");
      el.qrFileInput.setAttribute("capture", "environment");

  // 实时扫描循环：每帧用 jsQR 检测
  function startScanLoop() {
    const video = el.scanVideo;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    function tick() {
      if (!scanStream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (vw && vh) {
          // 限制送入 jsQR 的最大边长（仅缩小），提速解码 → 每秒尝试次数更多
          const SCAN_MAX = 1280;
          const sc = Math.min(1, SCAN_MAX / Math.max(vw, vh));
          canvas.width = Math.max(1, Math.round(vw * sc));
          canvas.height = Math.max(1, Math.round(vh * sc));
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = (typeof jsQR !== "undefined")
            ? jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" })
            : null;
          if (code && code.data) {
            // 扫到了！
            stopScan();
            el.scanHint.textContent = "✅ 扫描成功！";
            setTimeout(function () {
              el.scanOverlay.classList.remove("open");
              applyImportedConfig(code.data);
            }, 500);
            return;
          }
        }
      }
      scanRAF = requestAnimationFrame(tick);
    }
    scanRAF = requestAnimationFrame(tick);
  }

  // 停止扫描
  function stopScan() {
    if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
    if (scanStream) {
      scanStream.getTracks().forEach(function (t) { t.stop(); });
      scanStream = null;
    }
    el.scanVideo.srcObject = null;
  }

  el.scanCancel.addEventListener("click", function () {
    stopScan();
    el.scanOverlay.classList.remove("open");
  });

  // 相册选择
  el.qrImportAlbum.addEventListener("click", function () {
    el.qrImportOverlay.classList.remove("open");
    el.qrFileInput.removeAttribute("capture");
    el.qrFileInput.click();
  });

  // 文件选择后的处理（相机拍照或相册图片均走此路径）
  el.qrFileInput.addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    el.qrFileInput.value = ""; // 重置，允许重复选择同一文件
    if (!file) return;
    importFromImageFile(file);
  });

  // 从图片文件解析二维码并导入
  function importFromImageFile(file) {
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        try {
          const code = decodeQRFromImage(img);
          if (code && code.data) {
            applyImportedConfig(code.data);
          } else {
            showToast("未识别到二维码，请重试");
          }
        } catch (err) {
          showToast("解析失败：" + (err.message || "未知错误"));
        }
      };
      img.onerror = function () { showToast("无法读取图片"); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 多尺度尝试解码二维码，提升相册/截图识别率
  // （不同图片中二维码模块尺寸不一，jsQR 对模块像素大小敏感）
  function decodeQRFromImage(img) {
    if (typeof jsQR === "undefined") return null;
    const MAX = 1400;              // 限定最大边长，避免超大图拖慢
    const baseScale = Math.min(1, MAX / Math.max(img.width, img.height));
    // 依次尝试：正常 → 缩小（大图找小码）→ 放大（小图/模糊图）
    const scales = [baseScale, baseScale * 0.5, baseScale * 2];
    for (let i = 0; i < scales.length; i++) {
      const s = scales[i];
      const cw = Math.max(1, Math.round(img.width * s));
      const ch = Math.max(1, Math.round(img.height * s));
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      canvas.width = cw; canvas.height = ch;
      ctx.drawImage(img, 0, 0, cw, ch);
      const imageData = ctx.getImageData(0, 0, cw, ch);
      const code = jsQR(imageData.data, cw, ch, { inversionAttempts: "attemptBoth" });
      if (code && code.data) return code;
    }
    return null;
  }

  // 应用导入的配置（支持压缩格式和完整格式）
  function applyImportedConfig(jsonStr) {
    try {
      // 去除可能存在的 BOM 头（\uFEFF）
      jsonStr = jsonStr.replace(/^\uFEFF/, '');
      const parsed = JSON.parse(jsonStr);
      let validated;
      // 检测是压缩格式（有 s/m 字段）还是完整格式（有 schedules 字段）
      if (parsed.schedules) {
        validated = parseConfig(parsed);
      } else if (parsed.s) {
        const expanded = expandConfig(parsed);
        validated = parseConfig(expanded);
      } else {
        throw new Error("配置格式无效");
      }
      if (!validated.schedules) throw new Error("配置格式无效");
      cfg.schedules = validated.schedules;
      cfg.mode = validated.mode;
      cfg.bigSmallAnchor = validated.bigSmallAnchor;
      cfg.holidays = validated.holidays || {};
      cfg.leaves = validated.leaves || {};
      persist();
      renderModeUI(); renderWeekdayBar(); renderDayForm(); update();
      showToast("✅ 配置导入成功");
    } catch (e) {
      showToast("❌ 二维码内容无效");
    }
  }

  // ---------- 设置面板 Tab 切换 ----------
  function switchSettingsTab(tabId) {

  function openSettings() {

  el.settingsBtn.addEventListener("click", () => {

  el.settingsClose.addEventListener("click", closeSettings);
  el.settingsOverlay.addEventListener("click", closeSettings);

  // 月历月份切换
  if (el.calPrevBtn) el.calPrevBtn.addEventListener("click", function () {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    calRenderKey = "";   // 强制重画

  });
  if (el.calNextBtn) el.calNextBtn.addEventListener("click", function () {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    calRenderKey = "";
    renderCalendar();
  });

  // ---------- 核心计算与渲染 ----------
  function update() {
    const now = new Date();
    const todayIdx = now.getDay();
    const today = cfg.schedules[todayIdx];
    const todayIsWork = isWorkDay(now);

    let statusClass = "before";
    let statusText = "";
    let targetMs = 0;
    let subInfoHtml = "";

    if (!todayIsWork) {
      // 区分法定假日和普通周末
      var isLegalHoliday = isBuiltinHoliday(now) || (cfg.holidays && cfg.holidays[ymd(now)] === "holiday");
      if (isLegalHoliday) {
        statusClass = "holiday";
        statusText = "🎊 今天是法定节假日，" + WEEK_FULL[todayIdx] + "休息！";
      } else {
        statusClass = "holiday";
        statusText = "🎉 今天是" + WEEK_FULL[todayIdx] + "，休息日！";
      }
      targetMs = 0;
      const next = findNextWorkStart(now);
      if (next) {
        subInfoHtml = "距下一个工作日（" + WEEK_FULL[next.idx] + "）上班还有 <b>" + humanDuration(next.start - now) + "</b>";
      } else {
        subInfoHtml = "近期没有工作日了 😎";
      }
    } else {
      const base = now.getTime();
      const ws = toDate(today.workStart, base);
      const we = toDate(today.workEnd, base);
      const brk = currentBreak(today, now);

      // 检查是否为调休上班日（周末被强制上班）
      var isMakeupDay = (cfg.holidays && cfg.holidays[ymd(now)] === "workday") ||
                        BUILTIN_HOLIDAYS[ymd(now)] === "workday";
      var makeupSuffix = isMakeupDay ? "（调休上班）" : "";

      if (now < ws) {
        statusClass = "before";
        statusText = "😴 还没到上班时间" + makeupSuffix;
        targetMs = we - now;
        subInfoHtml = "距离上班还有 <b>" + humanDuration(ws - now) + "</b>";
      } else if (now >= we) {
        statusClass = "off";
        statusText = "🎉 已经下班啦，好好休息！";
        targetMs = 0;
        const next = findNextWorkStart(now);
        if (next) {
          subInfoHtml = "距下一个工作日（" + WEEK_FULL[next.idx] + "）上班还有 <b>" + humanDuration(next.start - now) + "</b>";
        } else {
          subInfoHtml = "本周内没有更多工作日了 😎";
        }
      } else if (brk) {
        statusClass = "break";
        const bName = brk.name || "休息";
        statusText = "🍵 " + bName + "中，放松一下吧";
        targetMs = we - now;
        const be = toDate(brk.end, base);
        subInfoHtml = "距离" + bName + "结束 <b>" + humanDuration(be - now) + "</b> · 距下班 <b>" + humanDuration(we - now) + "</b>";
      } else {
        statusClass = "working";
        statusText = "💼 努力工作中…" + (isMakeupDay ? "（调休）" : "");
        targetMs = we - now;
        // 「还需工作」已移至「今日工作进度」标签；「距下班」由倒计时体现，不再单独显示
        // 距离下一段休息，并排显示在状态文字中
        const nextBreak = findNextBreak(today, now);
        if (nextBreak) {
          statusText += " ｜ ☕ 距" + nextBreak.name + " " + humanDuration(nextBreak.time - now);
        }
        el.nextBreakBadge.style.display = "none";
        }
    }

    const d = fmtDur(targetMs);
    el.hh.textContent = pad(d.h);
    el.mm.textContent = pad(d.m);
    el.ss.textContent = pad(d.s);

    el.status.className = "status " + statusClass;
    el.status.textContent = statusText;
    // 非工作状态时隐藏"距休息"徽章
    if (statusClass !== "working") el.nextBreakBadge.style.display = "none";
    el.subInfo.innerHTML = subInfoHtml;
    el.subInfo.style.display = subInfoHtml ? "" : "none";

    // 记录目标时刻（绝对时间戳），供高频循环实时递减含毫秒
    if (targetMs > 0) {
      lastTargetEpoch = now.getTime() + targetMs;
    } else {
      lastTargetEpoch = 0;
    }
    renderCountdown();

    // 今日进度条
    const totalWork = todayIsWork ? totalWorkMs(today) : 0;
    let doneMs = 0;
    if (todayIsWork) {
      const ws = toDate(today.workStart, now.getTime());
      if (now > ws) doneMs = netWorkMs(today, ws, now);
    }
    const pct = totalWork > 0 ? Math.min(100, Math.max(0, (doneMs / totalWork) * 100)) : 0;
    el.progressFill.style.width = pct.toFixed(1) + "%";
    el.progressPct.textContent = pct.toFixed(0) + "%";
    // 进度标签：工作时段内追加「还需工作 X」（原 sub-info 行的内容）
    let progLabel = "今日工作进度";
    if (todayIsWork) {
      const wStart = toDate(today.workStart, now.getTime());
      const wEnd = toDate(today.workEnd, now.getTime());
      if (now >= wStart && now < wEnd) {
        const remaining = Math.max(0, totalWork - doneMs);
        if (remaining > 0) progLabel = "今日工作进度 · 还需工作 " + humanDuration(remaining);
      }
    }
    el.progressLabel.textContent = progLabel;

    // 本周进度条
    const week = computeWeekProgress(now);
    el.weekFill.style.width = week.pct.toFixed(1) + "%";
    el.weekPct.textContent = week.pct.toFixed(0) + "%";

    // 月历（内部有签名缓存，未变化不会重画）
    renderCalendar();
  }

  // 目标时刻（下班时刻）的绝对时间戳，0 表示归零（已下班/休息日）
  let lastTargetEpoch = 0;

  // 高频渲染倒计时数字（含毫秒），不碰其他 UI
  function renderCountdown() {
    const now = Date.now();
    let ms = lastTargetEpoch > 0 ? lastTargetEpoch - now : 0;
    if (ms < 0) ms = 0;
    const d = fmtDur(ms);
    el.hh.textContent = pad(d.h);
    el.mm.textContent = pad(d.m);
    el.ss.textContent = pad(d.s);
    // 毫秒两位：剩余总毫秒对 1000 取余，再除 10 得到百分秒
    el.ms.textContent = "." + pad(Math.floor((ms % 1000) / 10));
  }

  // 本周工作进度：周一到周日为一周
  function computeWeekProgress(now) {
    const monday = getMondayOfWeek(now);
    let totalMs = 0;
    let doneMs = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday.getTime() + i * 86400000);
      if (!isWorkDay(d)) continue;
      const sch = cfg.schedules[d.getDay()];
      const dayTotal = totalWorkMs(sch);
      totalMs += dayTotal;
      // 已完成：当天之前的整天全算，当天按 netWorkMs(开工, now)
      if (ymd(d) < ymd(now)) {
        doneMs += dayTotal;
      } else if (ymd(d) === ymd(now)) {
        const ws = toDate(sch.workStart, d.getTime());
        if (now > ws) doneMs += netWorkMs(sch, ws, now);
      }
    }
    const pct = totalMs > 0 ? Math.min(100, Math.max(0, (doneMs / totalMs) * 100)) : 0;
    return { pct, totalMs, doneMs };
  }

  // ---------- 首页月历 ----------
  let calYear, calMonth;          // 当前展示的年/月（0 基月份）
  let calRenderKey = "";          // 上次渲染签名，避免每秒重画
  (function initCalMonth() {
    const t = new Date();
    calYear = t.getFullYear();
    calMonth = t.getMonth();
  })();

  function renderCalendar() {
    if (!el.calGrid) return;
    // 签名：年月 + 影响展示的关键配置；未变化则跳过
    const key = calYear + "-" + calMonth + "|" +
      cfg.mode + "|" + (cfg.bigSmallAnchor ? cfg.bigSmallAnchor.monday + cfg.bigSmallAnchor.type : "") + "|" +
      JSON.stringify(cfg.schedules) + "|" + JSON.stringify(cfg.holidays) + "|" +
      JSON.stringify(cfg.deletedBuiltinHolidays) + "|" + JSON.stringify(cfg.leaves) + "|" +
      ymd(new Date());   // 跨"今天"也要刷新
    if (key === calRenderKey) return;
    calRenderKey = key;

    const today = new Date();
    const todayKey = ymd(today);
    el.calMonthLabel.textContent = calYear + "年" + (calMonth + 1) + "月";

    const frag = document.createDocumentFragment();
    // 表头：一 二 三 四 五 六 日
    WEEK_ORDER.forEach(function (w) {
      const h = document.createElement("div");
      h.className = "cal-dow";
      h.textContent = WEEK_LABEL[w];
      frag.appendChild(h);
    });

    // 计算首格：本月第一天在 WEEK_ORDER 中的位置（周一起算）
    const first = new Date(calYear, calMonth, 1);
    const firstDow = first.getDay(); // 0=Sun..6=Sat
    // WEEK_ORDER = [1,2,3,4,5,6,0]，映射成 周一..周日 的列序
    const startOffset = (firstDow === 0 ? 6 : firstDow - 1);
    const startCellCount = 42;       // 固定 6 行
    const baseTime = new Date(calYear, calMonth, 1 - startOffset).getTime();

    for (let i = 0; i < startCellCount; i++) {
      const d = new Date(baseTime + i * 86400000);
      const inMonth = d.getMonth() === calMonth;
      const cell = document.createElement("div");
      cell.className = "cal-cell";
      if (!inMonth) cell.classList.add("outside");
      cell.dataset.date = ymd(d);

      const dk = ymd(d);
      const override = getHolidayOverride(d);
      const leave = isLeaveDay(d);
      const work = isWorkDay(d);

      let badge = "";        // 角标文字
      let hoursText = "";    // 工时小字
      let detail = WEEK_FULL[d.getDay()]; // 点击 toast 详情

      // 优先级判定（与配色对应）
      if (leave) {
        cell.classList.add("leave");
        badge = "假";
        const reason = cfg.leaves[dk];
        detail += " · 请假" + (reason ? "（" + reason + "）" : "");
      } else if (override === "holiday") {
        cell.classList.add("holiday");
        badge = "休";
        detail += " · 法定假日";
      } else if (override === "workday") {
        cell.classList.add("makeup");
        badge = "班";
        const sch = cfg.schedules[d.getDay()];
        const hrs = totalWorkMs(sch) / 3600000;
        detail += " · 调休上班 约" + hrs.toFixed(1) + "h";
      } else if (work) {
        cell.classList.add("work");
        const sch = cfg.schedules[d.getDay()];
        const hrs = totalWorkMs(sch) / 3600000;
        // 透明度随工时缩放（越多越浓）
        const alpha = Math.max(0.18, Math.min(0.55, hrs / 10));
        cell.style.background = "rgba(255, 209, 102, " + alpha.toFixed(3) + ")";
        hoursText = hrs.toFixed(1) + "h";
        detail += " · 上班 约" + hrs.toFixed(1) + "h";
      } else {
        cell.classList.add("rest");
        detail += " · 休息";
      }

      if (dk === todayKey) {
        cell.classList.add("today");
        detail += " · 今天";
      }

      let inner = '<span class="cal-num">' + d.getDate() + '</span>';
      if (hoursText) inner += '<span class="cal-hours">' + hoursText + '</span>';
      if (badge) inner += '<span class="cal-badge">' + badge + '</span>';
      cell.innerHTML = inner;

      if (inMonth) {
        cell.addEventListener("click", function () {
          showToast(dk + " " + detail);
        });
      }
      frag.appendChild(cell);
    }

    el.calGrid.innerHTML = "";
    el.calGrid.appendChild(frag);
  }

  // ---------- 启动 ----------
  // 1) 先用 localStorage 同步初始化，避免界面空白闪烁
  cfg = parseConfig(readLocalSync());
  renderModeUI();
  renderWeekdayBar();
  renderDayForm();
  update();

  // 2) 再用原生 Preferences 异步加载（更可靠）。
  //    只在用户尚未做任何修改（isInitialLoad）时才覆盖 cfg，
  //    否则这条在启动时拍下的旧加载回调会覆盖掉用户刚刚导入的二维码配置 / 手动修改。
  loadConfigAsync().then(function (saved) {
    if (!isInitialLoad) return;  // 用户已改过 cfg，保留用户的修改
    isInitialLoad = false;
    if (!saved) return;
    const next = parseConfig(saved);
    cfg.schedules = next.schedules;
    cfg.mode = next.mode;
    cfg.bigSmallAnchor = next.bigSmallAnchor;
    cfg.holidays = next.holidays || {};
    cfg.leaves = next.leaves || {};
    renderModeUI();
    renderWeekdayBar();
    renderDayForm();
    update();
  }).catch(function () { isInitialLoad = false; });

  // 全屏沉浸式由原生 MainActivity 统一管理，此处不再调用 status-bar 插件（避免冲突）
  // 状态/进度每秒更新一次；倒计时数字（含毫秒）高频刷新，平滑跳动
  setInterval(update, 1000);
  function tickCountdown() {
    renderCountdown();
    requestAnimationFrame(tickCountdown);
  }
  requestAnimationFrame(tickCountdown);
})();

// ============ 解压发泄特效引擎 ============
(function () {
  "use strict";

  const canvas = document.getElementById("fxCanvas");
  const ctx = canvas.getContext("2d");
  const ventBtn = document.getElementById("ventBtn");
  const ventPanel = document.getElementById("ventPanel");
  const ventGrid = document.getElementById("ventGrid");

  // 适配高清屏
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // ---------- 粒子系统 ----------
  const particles = [];
  const MAX_PARTICLES = 1200; // 粒子上限，防止连点卡顿
  function W() { return window.innerWidth; }
  function H() { return window.innerHeight; }
  const rand = (a, b) => a + Math.random() * (b - a);

  // 安全添加粒子：超限时丢弃最早的
  function addParticle(p) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    particles.push(p);
  }

  // 烟花：真实绽放——上升火箭带闪烁拖尾，到顶球形爆炸 + 闪烁星 + 下落拖尾
  function launchFirework() {
    const x = rand(W() * 0.15, W() * 0.85);
    const targetY = rand(H() * 0.12, H() * 0.4);
    const startY = H();
    const hue = Math.floor(rand(0, 360));
    const riseFrames = 55;
    addParticle({
      type: "rocket", x: x, y: startY, vx: rand(-0.3, 0.3),
      vy: -(startY - targetY) / riseFrames, life: riseFrames, maxLife: riseFrames,
      hue: hue, size: 2.5, trail: [],
    });
  }
  function explodeFirework(x, y, hue) {
    // 球形爆炸：两层（外圈快、内圈慢），形成立体感
    const outer = 48, inner = 24;
    for (let i = 0; i < outer; i++) {
      const angle = (Math.PI * 2 * i) / outer + rand(-0.05, 0.05);
      const speed = rand(3.5, 6.5);
      addParticle({
        type: "star", x: x, y: y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: rand(60, 95), maxLife: 95,
        hue: hue + rand(-15, 15), size: rand(2, 3.5),
        trail: [], twinkle: rand(0, Math.PI * 2),
      });
    }
    for (let i = 0; i < inner; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(1, 3);
      addParticle({
        type: "star", x: x, y: y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: rand(40, 70), maxLife: 70,
        hue: hue + rand(-20, 20), size: rand(1.5, 2.5),
        trail: [], twinkle: rand(0, Math.PI * 2),
      });
    }
    // 中心闪光
    addParticle({ type: "flash", x: x, y: y, life: 12, maxLife: 12, size: 40, hue: hue });
  }

  // 打拳：拳头飞向随机点，撞击后随机位置碎屏
  function launchPunch() {
    const emojis = ["👊", "🥊", "💪"];
    // 撞击点随机（屏幕中央区域，避免太靠边）
    const cx = rand(W() * 0.25, W() * 0.75);
    const cy = rand(H() * 0.25, H() * 0.65);
    const fromLeft = Math.random() < 0.5;

  // 撕纸：屏幕在随机位置被撕开一条竖向裂缝，可多次叠加
  let tearCooldown = 0;
  function launchTear() {
    // 轻量冷却（150ms）+ 最多 6 条叠加，防止疯狂连点卡顿
    const now = Date.now();
    if (now - tearCooldown < 150) return;
    tearCooldown = now;
    const existing = document.querySelectorAll(".tear-overlay");
    if (existing.length >= 6) existing[0].remove();

    const w = W(), h = H();
    // 随机撕裂位置（20%~80%，避免太靠边）
    const tearX = rand(w * 0.2, w * 0.8);
    const leftW = tearX;
    const rightW = w - tearX;
    // 分离距离（随机，让每次撕裂幅度不同）
    const shiftL = -rand(18, 40);
    const shiftR = rand(18, 40);
    // 当前背景色
    const bg1 = getComputedStyle(document.documentElement).getPropertyValue("--bg-1").trim() || "#667eea";
    const bg2 = getComputedStyle(document.documentElement).getPropertyValue("--bg-2").trim() || "#764ba2";

    // 生成锯齿撕裂边缘 path（竖向锯齿）
    function makeJaggedPath(height) {
      const steps = 16;
      let d = "M0,0";
      for (let i = 0; i < steps; i++) {
        const y0 = i * (height / steps);
        const y1 = (i + 0.5) * (height / steps);
        const y2 = (i + 1) * (height / steps);
        d += " L" + rand(8, 18).toFixed(1) + "," + y1.toFixed(1);
        d += " L" + rand(1, 5).toFixed(1) + "," + y2.toFixed(1);
      }
      d += " L0," + height + " Z";
      return d;
    }

    const overlay = document.createElement("div");
    overlay.className = "tear-overlay";

    // 左片
    const pieceL = document.createElement("div");
    pieceL.className = "tear-piece-l";
    pieceL.style.width = leftW + "px";
    pieceL.style.background = "linear-gradient(90deg, " + bg2 + ", " + bg1 + ")";
    // 左片右边缘贴锯齿（黑色阴影）
    const jagL = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    jagL.setAttribute("class", "tear-jag");
    jagL.style.right = "0";
    jagL.setAttribute("width", "20");
    jagL.setAttribute("height", h);
    jagL.setAttribute("viewBox", "0 0 20 " + h);
    jagL.setAttribute("preserveAspectRatio", "none");
    const pathL = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pathL.setAttribute("d", makeJaggedPath(h));
    pathL.setAttribute("fill", "rgba(0,0,0,0.75)");
    jagL.appendChild(pathL);
    pieceL.appendChild(jagL);

    // 右片
    const pieceR = document.createElement("div");
    pieceR.className = "tear-piece-r";
    pieceR.style.width = rightW + "px";
    pieceR.style.background = "linear-gradient(270deg, " + bg2 + ", " + bg1 + ")";
    // 右片左边缘贴锯齿
    const jagR = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    jagR.setAttribute("class", "tear-jag");
    jagR.style.left = "0";
    jagR.style.transform = "scaleX(-1)";
    jagR.setAttribute("width", "20");
    jagR.setAttribute("height", h);
    jagR.setAttribute("viewBox", "0 0 20 " + h);
    jagR.setAttribute("preserveAspectRatio", "none");
    const pathR = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pathR.setAttribute("d", makeJaggedPath(h));
    pathR.setAttribute("fill", "rgba(0,0,0,0.75)");
    jagR.appendChild(pathR);
    pieceR.appendChild(jagR);

    overlay.appendChild(pieceL);
    overlay.appendChild(pieceR);
    document.body.appendChild(overlay);

    // 触发分离动画
    requestAnimationFrame(function () {
      pieceL.style.transform = "translateX(" + shiftL + "px)";
      pieceR.style.transform = "translateX(" + shiftR + "px)";
    });

    // 撕开瞬间纸屑从裂缝飞溅
    for (let i = 0; i < 24; i++) {
      addParticle({
        type: "confetti", x: tearX + rand(-10, 10), y: rand(0, h),
        vx: rand(-8, 8), vy: rand(-6, 3),
        life: rand(70, 130), maxLife: 130,
        w: rand(5, 11), h: rand(9, 16), rot: rand(0, Math.PI * 2), vrot: rand(-0.35, 0.35),
        color: ["#fff", "#ffd166", "#ff6b6b", "#06d6a0", "#667eea"][Math.floor(rand(0, 5))],
        swing: rand(0, Math.PI * 2), gravity: 0.2,
      });
    }

    // 1.4 秒后淡出移除（每次独立，互不影响）
    setTimeout(function () {
      overlay.style.transition = "opacity 0.4s ease";
      overlay.style.opacity = "0";
      setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 400);
    }, 1400);
  }

  // 彩带（庆祝专用）：从顶部洒下长条彩带

  // 动作配置（带防抖 key，防止短时间重复触发卡顿）
  const COOLDOWN = 300; // ms
  const lastFire = {};
  function debounced(key, fn) {
    return function () {
      const now = Date.now();
      if (now - (lastFire[key] || 0) < COOLDOWN) return;
      lastFire[key] = now;
      fn();
    };
  }
  // 变色：随机更换背景渐变色
  const BG_PALETTES = [
    ["#667eea", "#764ba2"], // 默认 紫蓝
    ["#f093fb", "#f5576c"], // 粉红
    ["#4facfe", "#00f2fe"], // 青蓝
    ["#43e97b", "#38f9d7"], // 翠绿
    ["#fa709a", "#fee140"], // 暖橙
    ["#30cfd0", "#330867"], // 深紫青
    ["#a8edea", "#fed6e3"], // 薄荷粉
    ["#ff9a9e", "#fecfef"], // 樱花
    ["#5ee7df", "#b490ca"], // 薰衣草
    ["#f6d365", "#fda085"], // 日落
    ["#0ba360", "#3cba92"], // 森林
    ["#ee9ca7", "#ffdde1"], // 蜜桃
  ];
  const BG_KEY = "work-countdown-bg";
  let bgIdx = 0;

  // 保存配色索引（localStorage + Preferences 双写）
  function saveBgIdx(idx) {
    try { localStorage.setItem(BG_KEY, String(idx)); } catch (e) {}
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
      window.Capacitor.Plugins.Preferences.set({ key: BG_KEY, value: String(idx) }).catch(function () {});
    }
  }

  // 应用配色（不保存）
  function applyBgIdx(idx) {
    bgIdx = idx;
    const [c1, c2] = BG_PALETTES[bgIdx] || BG_PALETTES[0];
    document.documentElement.style.setProperty("--bg-1", c1);
    document.documentElement.style.setProperty("--bg-2", c2);
    // 状态栏颜色由原生管理，这里只改 CSS 变量
  }

  // 启动时加载已保存的配色
  function loadBgIdx() {
    // 先同步读 localStorage
    let idx = null;
    try { idx = parseInt(localStorage.getItem(BG_KEY)); } catch (e) {}
    if (!isNaN(idx) && idx >= 0 && idx < BG_PALETTES.length) applyBgIdx(idx);
    // 再异步读 Preferences（更可靠）
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
      window.Capacitor.Plugins.Preferences.get({ key: BG_KEY }).then(function (res) {
        if (res.value != null) {
          const i = parseInt(res.value);
          if (!isNaN(i) && i >= 0 && i < BG_PALETTES.length) applyBgIdx(i);
        }
      }).catch(function () {});
    }
  }

  function changeBgColor() {
    let next;
    do { next = Math.floor(rand(0, BG_PALETTES.length)); } while (next === bgIdx && BG_PALETTES.length > 1);
    applyBgIdx(next);
    saveBgIdx(next);
  }

  const ACTIONS = [
    { emoji: "🎆", label: "放烟花", fn: debounced("fw", function () { for (let i = 0; i < 5; i++) setTimeout(launchFirework, i * 320); }) },
    { emoji: "👊", label: "打拳", fn: debounced("punch", launchPunch) },
    { emoji: "💩", label: "大便", fn: debounced("poop", launchPoop) },
    { emoji: "💢", label: "捏碎", fn: debounced("crush", launchCrush) },
    { emoji: "🎨", label: "变色", fn: debounced("bg", changeBgColor) },
    { emoji: "🎉", label: "庆祝", fn: debounced("party", function () { for (let i = 0; i < 3; i++) setTimeout(launchFirework, i * 450); launchConfetti(); }) },
  ];

  // 渲染表情面板
  ACTIONS.forEach(function (act) {
    const btn = document.createElement("button");
    btn.className = "vent-item";
    btn.innerHTML = act.emoji;
    btn.addEventListener("click", function () {
      act.fn();
      // 连点触发更多
    });
